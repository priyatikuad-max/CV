<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Priyati Golder – Portfolio</title>
<style>
  @page { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; }
  @font-face { font-family: "EB Garamond"; font-weight: 400; font-style: normal; src: url(fonts/eb-garamond-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-weight: 400; font-style: italic; src: url(fonts/eb-garamond-latin-400-italic.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-weight: 700; font-style: normal; src: url(fonts/eb-garamond-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-weight: 700; font-style: italic; src: url(fonts/eb-garamond-latin-700-italic.woff2) format("woff2"); }
  html, body { margin: 0; background: #fff; }
  body { font-family: Garamond, "EB Garamond", serif; color: #000; }

  /* One A4 landscape sheet per .page */
  .page {
    width: 297mm; height: 210mm;
    padding: 18mm 20mm 16mm;
    position: relative; overflow: hidden;
    break-after: page;
    display: grid;
    grid-template-columns: 1fr 120mm;
    grid-template-rows: auto 1fr auto;
    column-gap: 16mm;
  }

  /* Cover */
  .cover .top { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10pt; letter-spacing: 2pt; text-transform: uppercase; color: #555; }
  .cover .title { grid-column: 1; align-self: center; }
  .cover .kicker { font-size: 11pt; letter-spacing: 3pt; white-space: nowrap; text-transform: uppercase; margin: 0 0 6mm; color: #555; }
  .cover h1 { font-size: 54pt; font-weight: 400; line-height: 1; margin: 0; letter-spacing: 0.5pt; }
  .cover .line { width: 28mm; border-top: 0.75pt solid #000; margin: 8mm 0 6mm; }
  .cover .subtitle { font-size: 16pt; font-style: italic; margin: 0; }
  .cover .years { font-size: 12pt; margin: 3mm 0 0; color: #555; }
  .cover .drawing { grid-column: 2; grid-row: 2; align-self: center; justify-self: end; width: 120mm; }
  .cover .drawing svg { display: block; width: 100%; height: auto; }
  .cover .caption { font-size: 9pt; font-style: italic; color: #555; margin-top: 3mm; text-align: right; }
  .cover .bottom { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline;
    border-top: 0.5pt solid #aaa; padding-top: 4mm; font-size: 10.5pt; }
  .cover .bottom span + span::before { content: "|"; margin: 0 6pt; color: #888; }
  .cover .bottom a { color: inherit; text-decoration: none; }

  /* On screen, show each page like a sheet of paper */
  @media screen {
    html { background: #e5e5e5; }
    body { padding: 16px 0; }
    .page { margin: 0 auto 16px; box-shadow: 0 1px 6px rgba(0,0,0,.2); background: #fff; }
  }
  @media screen and (max-width: 1150px) {
    .page { zoom: 0.5; }
  }
</style>
</head>
<body>

<section class="page cover">
  <div class="top">
    <span>Portfolio</span>
    <span>Selected Works</span>
  </div>

  <div class="title">
    <p class="kicker">Architecture &amp; Cultural Heritage</p>
    <h1>Priyati Golder</h1>
    <div class="line"></div>
    <p class="subtitle">Documentation, Adaptive Reuse and Design</p>
    <p class="years">2018 – 2025</p>
  </div>

  <!-- Line drawing based on the Nine Dome Mosque plan, Bagerhat: 3 × 3 domed bays -->
  <figure class="drawing" style="margin:0">
    <svg viewBox="0 0 300 300" fill="none" stroke="#000" aria-label="Plan drawing of a nine-domed mosque">
      <!-- outer walls -->
      <rect x="20" y="20" width="260" height="260" stroke-width="2.2"/>
      <rect x="34" y="34" width="232" height="232" stroke-width="0.8"/>
      <!-- corner towers -->
      <circle cx="20" cy="20" r="11" stroke-width="1.4" fill="#fff"/>
      <circle cx="280" cy="20" r="11" stroke-width="1.4" fill="#fff"/>
      <circle cx="20" cy="280" r="11" stroke-width="1.4" fill="#fff"/>
      <circle cx="280" cy="280" r="11" stroke-width="1.4" fill="#fff"/>
      <!-- bay grid -->
      <g stroke-width="0.5" stroke-dasharray="3 3" stroke="#777">
        <line x1="111.3" y1="34" x2="111.3" y2="266"/>
        <line x1="188.7" y1="34" x2="188.7" y2="266"/>
        <line x1="34" y1="111.3" x2="266" y2="111.3"/>
        <line x1="34" y1="188.7" x2="266" y2="188.7"/>
      </g>
      <!-- columns -->
      <g fill="#000" stroke="none">
        <rect x="107.3" y="107.3" width="8" height="8"/>
        <rect x="184.7" y="107.3" width="8" height="8"/>
        <rect x="107.3" y="184.7" width="8" height="8"/>
        <rect x="184.7" y="184.7" width="8" height="8"/>
      </g>
      <!-- domes -->
      <g stroke-width="0.9">
        <circle cx="72.7" cy="72.7" r="30"/><circle cx="72.7" cy="72.7" r="18" stroke-width="0.4"/>
        <circle cx="150" cy="72.7" r="30"/><circle cx="150" cy="72.7" r="18" stroke-width="0.4"/>
        <circle cx="227.3" cy="72.7" r="30"/><circle cx="227.3" cy="72.7" r="18" stroke-width="0.4"/>
        <circle cx="72.7" cy="150" r="30"/><circle cx="72.7" cy="150" r="18" stroke-width="0.4"/>
        <circle cx="150" cy="150" r="30"/><circle cx="150" cy="150" r="18" stroke-width="0.4"/>
        <circle cx="227.3" cy="150" r="30"/><circle cx="227.3" cy="150" r="18" stroke-width="0.4"/>
        <circle cx="72.7" cy="227.3" r="30"/><circle cx="72.7" cy="227.3" r="18" stroke-width="0.4"/>
        <circle cx="150" cy="227.3" r="30"/><circle cx="150" cy="227.3" r="18" stroke-width="0.4"/>
        <circle cx="227.3" cy="227.3" r="30"/><circle cx="227.3" cy="227.3" r="18" stroke-width="0.4"/>
      </g>
      <!-- east entrances (bottom) and mihrab niches (top) -->
      <g stroke-width="1.4" fill="#fff">
        <rect x="64.7" y="274" width="16" height="12" stroke="none"/>
        <rect x="142" y="274" width="16" height="12" stroke="none"/>
        <rect x="219.3" y="274" width="16" height="12" stroke="none"/>
      </g>
      <g stroke-width="1">
        <path d="M64.7 20 v-8 a8 8 0 0 1 16 0 v8"/>
        <path d="M142 20 v-8 a8 8 0 0 1 16 0 v8"/>
        <path d="M219.3 20 v-8 a8 8 0 0 1 16 0 v8"/>
      </g>
    </svg>
    <figcaption class="caption">Nine Dome Mosque, Bagerhat – plan study</figcaption>
  </figure>

  <div class="bottom">
    <div>
      <span>Halle (Saale), Germany</span><span><a href="mailto:priyati.kuad@gmail.com">priyati.kuad@gmail.com</a></span><span>+49 155 66349276</span>
    </div>
    <div><em>M.A. Architectural and Cultural Heritage · B.Arch.</em></div>
  </div>
</section>

</body>
</html>
